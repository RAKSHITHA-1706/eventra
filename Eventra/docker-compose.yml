services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventra}
      POSTGRES_USER: ${POSTGRES_USER:-eventra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
    ports: ["5432:5432"]
    volumes: ["eventra_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventra} -d ${POSTGRES_DB:-eventra}"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-eventra}:${POSTGRES_PASSWORD:-change_this_password}@postgres:5432/${POSTGRES_DB:-eventra}
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:5173
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  eventra_pg:
